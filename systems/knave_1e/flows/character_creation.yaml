id: character_creation
type: flow
name: "Character Creation"
description: "Character creation process for {{ system.name }}"
version: "1.0"

# inputs: []
outputs:
  - type: character
    id: knave
    validate: true

variables:
  - type: str
    id: hp_dice_roll
    description: "The dice roll used to determine hit points."

steps:
  - id: invoke_roll_abilities
    name: "Invoke Roll Abilities"
    type: flow_call
    flow: roll_abilities
    actions:
      # for this step, result is the "outputs" of the sub-flow
      - set_value:
          path: "outputs.knave.abilities"
          value: "{{ result.abilities }}"
    next_step: invoke_roll_hit_points

  - id: invoke_roll_hit_points
    name: "Invoke Roll Hit Points"
    type: flow_call
    flow: roll_hit_points
    actions:
      - set_value:
          path: "outputs.knave.hit_points"
          value: "{{ result.hit_points }}"
    next_step: choose_weapon

  - id: choose_weapon
    name: "Choose Starting Weapon"
    type: player_choice
    prompt: "Choose one weapon to start with:"
    choice_source:
      table: weapons
    actions:
      - flow_call:
          flow: add_item_to_character
          inputs:
            character: "{{ outputs.knave }}"
            item: "{{ selected_item }}"
    next_step: roll_starting_gear

  - id: roll_starting_gear
    name: "Determine Starting Equipment"
    type: table_roll
    prompt: "Rolling for your starting equipment..."
    parallel: true
    tables:
      - table: armor
        actions:
          - flow_call:
              flow: add_item_to_character
              inputs:
                character: "{{ outputs.knave }}"
                item: "{{ result.entry }}"
      - table: helmets_and_shields
        actions:
          - flow_call:
              flow: add_item_to_character
              inputs:
                character: "{{ outputs.knave }}"
                item: "{{ result.entry }}"
      - table: dungeoneering_gear
        count: 2
        actions:
          - flow_call:
              flow: add_items_to_character
              inputs:
                character: "{{ outputs.knave }}"
                items: "{{ results | map(attribute='entry') | list }}"
      - table: general_gear_1
        actions:
          - flow_call:
              flow: add_item_to_character
              inputs:
                character: "{{ outputs.knave }}"
                item: "{{ result.entry }}"
      - table: general_gear_2
        actions:
          - flow_call:
              flow: add_item_to_character
              inputs:
                character: "{{ outputs.knave }}"
                item: "{{ result.entry }}"
    additional_actions:
      - flow_call:
          flow: add_item_to_character
          inputs:
            character: "{{ outputs.knave }}"
            item: rations
            quantity: 2

  - id: generate_traits
    name: "Determine Character Traits"
    type: table_roll
    prompt: "Rolling for your character's physical and personality traits..."
    parallel: true
    tables:
      - table: physique
        actions:
          - set_value:
              path: "outputs.knave.traits.physique"
              value: "{{ result.entry }}"
      - table: face
        actions:
          - set_value:
              path: "outputs.knave.traits.face"
              value: "{{ result.entry }}"
      - table: skin
        actions:
          - set_value:
              path: "outputs.knave.traits.skin"
              value: "{{ result.entry }}"
      - table: hair
        actions:
          - set_value:
              path: "outputs.knave.traits.hair"
              value: "{{ result.entry }}"
      - table: clothing
        actions:
          - set_value:
              path: "outputs.knave.traits.clothing"
              value: "{{ result.entry }}"
      - table: virtue
        actions:
          - set_value:
              path: "outputs.knave.traits.virtue"
              value: "{{ result.entry }}"
      - table: vice
        actions:
          - set_value:
              path: "outputs.knave.traits.vice"
              value: "{{ result.entry }}"
      - table: speech
        actions:
          - set_value:
              path: "outputs.knave.traits.speech"
              value: "{{ result.entry }}"
      - table: background
        actions:
          - set_value:
              path: "outputs.knave.traits.background"
              value: "{{ result.entry }}"
      - table: misfortunes
        actions:
          - set_value:
              path: "outputs.knave.traits.misfortunes"
              value: "{{ result.entry }}"
      - table: alignment
        actions:
          - set_value:
              path: "outputs.knave.traits.alignment"
              value: "{{ result.entry }}"

  - id: choose_gender_choice
    name: "Gender Determination Choice"
    type: player_choice
    prompt: "How would you like to determine your character's gender?"
    choices:
      - id: player_choice
        label: "Player Choice"
        next_step: "choose_gender"
      - id: random_roll
        label: "Randomly Choose"
        next_step: "roll_gender"

  - id: choose_gender
    name: "Choose Character Gender"
    type: player_choice
    prompt: "Select your gender"
    choices:
      - id: female
        label: "Female"
        actions:
          - set_value:
              path: "outputs.knave.gender"
              value: "Female"
      - id: male
        label: "Male"
        actions:
          - set_value:
              path: "outputs.knave.gender"
              value: "Male"
      - id: non_binary
        label: "Non-binary"
        actions:
          - set_value:
              path: "outputs.knave.gender"
              value: "Non-binary"
    next_step: choose_name

  - id: roll_gender
    name: "Determine Character Gender"
    type: table_roll
    prompt: "Rolling for your character's gender..."
    tables:
      - table: gender
        actions:
          - set_value:
              path: "outputs.knave.gender"
              value: "{{ result.entry }}"
    next_step: choose_name

  - id: choose_name
    name: "Choose Character Name"
    type: player_input
    prompt: "What is your character's name?"
    actions:
      - set_value:
          path: "outputs.knave.name"
          value: "{{ result }}"

  - id: character_description
    name: "Generate Character Description"
    type: llm_generation
    condition: "llm_enabled"
    prompt_id: character_description
    prompt_data:
      name: "{{ outputs.knave.name }}"
      gender: "{{ outputs.knave.gender }}"
      traits: "{{ outputs.knave.traits }}"
    llm_settings:
      provider: ollama
      model: gemma3
      max_tokens: 200
    actions:
      - set_value:
          path: "outputs.knave.description"
          value: "{{ result }}"

  - id: review_character
    name: "Review and Confirm Character"
    type: player_choice
    prompt: "Here is your completed character:"
    pre_actions:
      - display_value: "outputs.knave"
    choices:
      - id: accept
        label: "Accept this character"
        next_step: "finalize_character"
      - id: reroll
        label: "Start over with a new character"
        next_step: "roll_abilities"
        reset_outputs: true

  - id: finalize_character
    name: "Character Creation Complete"
    type: completion
    prompt: "Your Knave is ready for adventure!"
    actions:
      - validate_value: "outputs.knave"
      - set_value:
          path: "outputs.knave.level"
          value: 1
      - log_event:
          type: "character_created"
          data: "{{ outputs.knave.name or 'Unnamed Knave' }}"

# Flow control
resume_points:
  [
    "ability_swap_choice",
    "choose_weapon",
    "generate_traits",
    "review_character",
  ]
